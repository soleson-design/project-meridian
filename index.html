<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Month End Close Tracker | Month-End Close Tracker</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <!-- Styles -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!-- Header Bar -->
    <header class="header">
        <div class="header-left">
            <!-- Anaconda logo -->
            <img src="./anaconda-logo.png" alt="Anaconda" class="logo">
        </div>
        <div class="header-center">
            <h1 class="app-title">Month End Close Tracker</h1>
        </div>
        <div class="header-right">
            <div class="period-selector">
                <select id="monthSelector" class="month-select">
                    <option value="0">January</option>
                    <option value="1">February</option>
                    <option value="2">March</option>
                    <option value="3">April</option>
                    <option value="4">May</option>
                    <option value="5">June</option>
                    <option value="6">July</option>
                    <option value="7">August</option>
                    <option value="8">September</option>
                    <option value="9">October</option>
                    <option value="10">November</option>
                    <option value="11">December</option>
                </select>
                <select id="yearSelector" class="year-select">
                    <!-- Years populated by JavaScript -->
                </select>
            </div>
            <button id="darkModeToggle" class="dark-mode-toggle" onclick="App.toggleDarkMode()" title="Toggle dark mode">
                🌙
            </button>
        </div>
    </header>

    <!-- Tab Navigation -->
    <nav class="tab-nav" id="tabNav">
        <!-- Tabs dynamically generated by JavaScript -->
    </nav>

    <!-- Main Content Area -->
    <main class="main-content">
        <!-- Loading State -->
        <div id="loadingState" class="loading-state">
            <div class="spinner"></div>
            <p>Loading tasks...</p>
        </div>

        <!-- Error State -->
        <div id="errorState" class="error-state" style="display: none;">
            <p class="error-message" id="errorMessage"></p>
            <button onclick="App.loadTasks()" class="btn-retry">Retry</button>
        </div>

        <!-- Tab Content Container -->
        <div id="tabContent" style="display: none;">
            <!-- Content dynamically generated by JavaScript -->
        </div>
    </main>

    <!-- Modal for Completer Name -->
    <div id="completerModal" class="modal" style="display: none;">
        <div class="modal-content">
            <h3>Mark Task as Complete</h3>
            <p>Enter your name:</p>
            <input type="text" id="completerNameInput" class="completer-input" placeholder="Your name">
            <div class="modal-actions">
                <button onclick="App.cancelComplete()" class="btn-secondary">Cancel</button>
                <button onclick="App.confirmComplete()" class="btn-primary">Complete Task</button>
            </div>
        </div>
    </div>

    <!-- Configuration -->
    <script src="./config.js"></script>

    <!-- Application Logic -->
    <script src="./app.js"></script>
</body>
</html>
